# Render blueprint for the StudyCRM API.
#
# The repo is an npm-workspaces monorepo, so the service builds from the repo
# root: `npm ci` resolves the single root lockfile, and only the backend
# workspace is compiled and started.
#
# Every secret below is marked `sync: false` — Render prompts for it on first
# deploy and never stores it in git.
services:
  - type: web
    name: studycrm-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    # --include=dev is required: Render sets NODE_ENV=production, which would
    # otherwise skip devDependencies and leave the build without typescript.
    buildCommand: npm ci --include=dev && npm run build:backend
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MODE
        value: live
      - key: LIVE_MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Must match the LIVE_ values in crm/.env and student/.env.
      - key: LIVE_CLIENT_CRM_URL
        sync: false
      - key: LIVE_CLIENT_STUDENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: la-europa-docs
